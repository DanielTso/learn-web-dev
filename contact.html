<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NWFH1G2VXN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-NWFH1G2VXN');
</script>
</head>
<body>
    <!-- Navigation Bar -->
    <div id="navbar-mount"></div>

    <!-- Hero Section -->
    <header class="bg-light text-center py-5">
        <div class="container">
            <h1 class="display-4">Contact Us</h1>
            <p class="lead">Have questions, feedback, or suggestions? We'd love to hear from you!</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <!-- Contact Form Card -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Send Us a Message</h5>
                    </div>
                    <div class="card-body">
                        <form id="contact-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="5" placeholder="Your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Social Media Card -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Connect With Us</h5>
                    </div>
                    <div class="card-body">
                        <p>We'd love to connect with you on social media!</p>
                        <ul class="list-unstyled">
                            <li class="mb-2"><a href="#" class="btn btn-outline-primary w-100 text-start"><i class="fab fa-twitter me-2"></i> Twitter</a></li>
                            <li class="mb-2"><a href="#" class="btn btn-outline-primary w-100 text-start"><i class="fab fa-linkedin me-2"></i> LinkedIn</a></li>
                            <li class="mb-2"><a href="#" class="btn btn-outline-primary w-100 text-start"><i class="fab fa-github me-2"></i> GitHub</a></li>
                            <li class="mb-2"><a href="mailto:info@devblog.com" class="btn btn-outline-primary w-100 text-start"><i class="fas fa-envelope me-2"></i> Email Us</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Initialize components
        document.addEventListener('DOMContentLoaded', function() {
            initNavbar('contact');
            initFooter();
        });
    </script>
</body>
</html>
